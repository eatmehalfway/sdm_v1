services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ccq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ccq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccq"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  ccq_postgres_data:
